<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codex Agent Terminal</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="terminal-mode">
    <main id="terminal-view">
      <header><h1>Codex Agent Terminal</h1><button id="close-terminal" type="button">Close</button></header>
      <div id="terminal-output" role="log" aria-live="polite" data-placeholder="true">Waiting for Codex…</div>
      <form id="terminal-input" autocomplete="off">
        <input id="terminal-prompt" type="text" placeholder="Type a follow-up prompt…" aria-label="Codex follow-up prompt" />
        <button type="submit">Send</button>
      </form>
    </main>
    <script src="ui.js"></script>
  </body>
</html>
